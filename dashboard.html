<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Drawer and Overlay injected via renderDrawer() -->


        <div class="header" style="background-color: #f2994a; height: 70px;">
            <div class="header-left">
                <a href="location_details.html" class="icon-btn" style="font-size: 24px;">←</a>
                <span style="font-size: 20px; font-weight: 500; margin-left: 15px;">मकानसूचीकरण कार्य</span>
            </div>
            <div class="header-right">
                <span class="icon-btn" onclick="toggleDrawer()" style="font-size: 24px;">☰</span>
            </div>
        </div>

        <div style="padding: 20px 15px;">
            <div style="border: 2px solid #333; border-radius: 20px; padding: 10px; text-align: center; font-weight: bold; font-size: 16px;">
                मकानसूची ब्लॉक नम्बर <span style="margin-left: 10px;">0003</span>
            </div>
        </div>

        <div class="dashboard-grid" style="gap: 20px; padding: 0 15px;">
            <!-- 1. मकानसूची की प्रविष्टि -->
            <a href="house_listing.html" class="menu-card">
                <div class="icon-circle" style="background-color: #e8f5e9; color: #2ecc71;">
                    <i class="fas fa-list-ul"></i>
                </div>
                <span class="menu-label">मकानसूची की प्रविष्टि</span>
            </a>
            
            <!-- 2. डेटा अपडेट करें -->
            <a href="house_update.html" class="menu-card">
                <div class="icon-circle" style="background-color: #fff8e1; color: #f39c12;">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <span class="menu-label">डेटा अपडेट करें</span>
            </a>
            
            <!-- 3. सिंक किया गया डेटा सुधारें -->
            <a href="house_synced_edit.html" class="menu-card">
                <div class="icon-circle" style="background-color: #f3e5f5; color: #9b59b6;">
                    <i class="fas fa-pen"></i>
                </div>
                <span class="menu-label">पहले से सिंक किए गए डेटा को संशोधित करें</span>
            </a>
            
            <!-- 4. सारांश देखें -->
            <a href="house_summary.html" class="menu-card">
                <div class="icon-circle" style="background-color: #e3f2fd; color: #3498db;">
                    <i class="fas fa-eye"></i>
                </div>
                <span class="menu-label">सारांश देखें</span>
            </a>
            
            <!-- 5. सिंक करें -->
            <a href="house_sync.html" class="menu-card">
                <div class="icon-circle" style="background-color: #fbe9e7; color: #e67e22;">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <span class="menu-label">सिंक करें</span>
            </a>
            
            <!-- 6. पूर्ण के रूप में चिह्नित करें -->
            <a href="house_finish.html" class="menu-card">
                <div class="icon-circle" style="background-color: #e8f5e9; color: #2ecc71;">
                    <i class="fas fa-check-double"></i>
                </div>
                <span class="menu-label">पूर्ण के रूप में चिह्नित करें</span>
            </a>
        </div>

        <!-- Footer -->
        <div style="text-align: center; padding: 40px 20px; font-size: 14px; color: #333; line-height: 1.6;">
            भारत के महारजिस्ट्रार एवं जनगणना<br>
            आयुक्त का कार्यालय गृह मंत्रालय, भारत सरकार<br>
            द्वारा डिजाइन और विकसित
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const user = getCurrentUser();
        renderDrawer(); // Add hamburger menu
        
        // Show Supervisor-only sections
        if (user.role === 'supervisor') {
            const isS001 = user.id.toLowerCase() === 's001' || user.id.toLowerCase() === 'e001';
            const enumCount = isS001 ? 6 : 0;
            const supervisorCard = `
                <a href="supervisor.html" class="menu-card" style="border: 2px solid #9b59b6; grid-column: span 2;">
                    <div class="icon-circle" style="background-color: #f3e5f5; color: #9b59b6; width: 60px; height: 60px;">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <div style="text-align: left; flex: 1; margin-left: 15px;">
                        <span class="menu-label" style="font-size: 16px; font-weight: bold;">प्रगणक कार्य समीक्षा (Review)</span>
                        <p style="font-size: 11px; color: #666; margin-top: 5px;">${enumCount} प्रगणकों का डेटा समीक्षा के लिए उपलब्ध है</p>
                    </div>
                </a>
            `;
            grid.insertAdjacentHTML('afterbegin', supervisorCard);
        }

        // Set User Details in Drawer
        try {
            document.querySelector('.user-id').innerText = user.id;
            document.querySelector('.user-role').innerHTML = `Role: <br><span style="font-size: 9px;">${(user.role || 'enumerator').toUpperCase()}</span>`;
        } catch(e) {}
    </script>
</body>
</html>
