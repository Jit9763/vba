<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - पयवेक होम पेज</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sup-container { padding: 20px; }
        .sup-header-pill {
            background: #f2994a; color: white; padding: 12px; border-radius: 25px;
            text-align: center; font-weight: bold; font-size: 15px; margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(242, 153, 74, 0.3);
        }
        .sup-label { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; display: block; text-align: center; }
        .sup-select {
            width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc;
            font-size: 16px; background: white; margin-bottom: 40px;
        }
        .sup-btn-orange {
            background: #f2994a; color: white; border: none; border-radius: 10px;
            padding: 15px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer;
            margin-bottom: 15px;
        }
        .sup-btn-outline {
            background: white; color: #333; border: 1px solid #ddd; border-radius: 10px;
            padding: 15px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer;
            text-align: center; display: block; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background: white;">
        <div class="header" style="background-color: #f2994a; height: 75px;">
            <div class="header-left">
                <span style="font-size: 24px; color: white; margin-left: 15px;">☰</span>
                <span style="font-size: 20px; font-weight: 500; margin-left: 15px;">एचएलओ ऐप</span>
            </div>
            <div class="header-right">
                <div style="display:flex; gap: 15px; color: white; font-size: 18px; margin-right: 15px;">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-three-quarters"></i>
                    <span>44%</span>
                </div>
            </div>
        </div>

        <div class="sup-container">
            <div class="sup-header-pill">प्रगणक और एचएलबी सूची</div>
            
            <label class="sup-label">प्रगणक का नाम चुनें</label>
            <select id="enumerator-select" class="sup-select">
                <option value="">गणनाकर्ता चुनें</option>
                <!-- Will be populated from app.js -->
            </select>

            <button class="sup-btn-orange" onclick="getHLBDetails()">एचएलबी विवरण प्राप्त करें</button>
            
            <a href="dashboard.html" class="sup-btn-outline">बाहर निकलें</a>
        </div>

        <div style="position: absolute; bottom: 40px; width: 100%; text-align: center; color: #888; font-size: 12px;">
            भारत के महारजिस्ट्रार एवं जनगणना आयुक्त का कार्यालय<br>
            द्वारा डिजाइन और विकसित
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function loadEnums() {
            const mockData = getSupervisorMockData();
            const select = document.getElementById('enumerator-select');
            Object.keys(mockData).forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = mockData[id].name + " (" + id + ")";
                select.appendChild(opt);
            });
        }

        function getHLBDetails() {
            const enumId = document.getElementById('enumerator-select').value;
            if (!enumId) {
                alert("कृपया एक प्रगणक चुनें");
                return;
            }
            setFormState('selected_enumerator_id', enumId);
            window.location.href = 'supervisor_location.html';
        }

        window.onload = loadEnums;
    </script>
</body>
</html>
