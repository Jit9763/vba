<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - Splash</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .splash-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: white;
            text-align: center;
        }
        .splash-logo { width: 150px; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="splash-container" onclick="window.location.href='login.html'">
            <img src="census_logo.png" alt="Logo" class="splash-logo">
            <h1 style="color: var(--primary-orange); margin-top: 20px;">HLO</h1>
            <p style="color: var(--text-gray);">जनगणना 2027</p>
            <p style="font-size: 10px; color: #ccc; margin-top: 20px;">(Click to skip)</p>
        </div>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 3000);
    </script>
</body>
</html>
