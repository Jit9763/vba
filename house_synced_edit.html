<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - सिंक किया गया डेटा सुधारें</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .synced-header-text {
            color: #f2994a;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            padding: 0 20px;
            line-height: 1.4;
        }
        .record-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .record-line {
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
        }
        .record-label { font-weight: 500; color: #666; }
        .edit-icon-btn {
            margin-top: 10px;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            border-top: 1px solid #eee;
            padding-top: 10px;
            display: inline-block;
        }
        .status-synced { color: #2ecc71; font-weight: bold; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #fff;
            width: 85%;
            max-width: 400px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .reason-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f9f9f9;
            text-align: left;
            font-size: 14px;
            color: #444;
            cursor: pointer;
        }
        .reason-btn:hover { background: #eee; }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: #f5f5f5;">
        <div class="header" style="background-color: #f2994a; height: 70px;">
            <div class="header-left">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;">←</a>
                <span style="font-size: 18px; font-weight: 500; margin-left: 15px;">एचएलओ ऐप</span>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;"><i class="fas fa-home"></i></a>
            </div>
        </div>

        <div class="synced-header-text">पहले से सिंक किए गए डेटा को संशोधित करें</div>

        <div id="records-list" style="padding: 0 15px; flex: 1; overflow-y: auto;">
            <!-- Synced records will appear here -->
        </div>
    </div>

    <!-- Reason Modal -->
    <div id="reason-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">On the recommendation of</div>
            <button class="reason-btn" onclick="confirmEdit('By Supervisor')">By Supervisor</button>
            <button class="reason-btn" onclick="confirmEdit('By Charge Officer')">By Charge Officer</button>
            <button class="reason-btn" onclick="confirmEdit('By Self')">By Self</button>
            <button class="reason-btn" style="background: #eee; text-align: center;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let selectedRecordIndex = -1;

        function loadSyncedRecords() {
            const records = getSyncedRecords();
            const list = document.getElementById('records-list');
            
            if (records.length === 0) {
                list.innerHTML = `<div class="empty-state" style="text-align:center; padding:50px; color:#888;">कोई सिंक किया गया डेटा उपलब्ध नहीं है।</div>`;
                return;
            }

            list.innerHTML = records.map((rec, index) => `
                <div class="record-card">
                    <div class="record-line"><span class="record-label">लाइन क्रमांक::</span> ${rec.line || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">जनगणना मकान नंबर:</span> ${rec.answers?.q2 || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">भवन नम्बर:</span> ${rec.building_no || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">परिवार क्रमांक:</span> ${rec.answers?.q9 || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">परिवार के मुखिया का नाम:</span> ${rec.answers?.q11 || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">स्थिति:</span> <span class="status-synced">सिंक किया गया</span></div>
                    
                    <div class="edit-icon-btn" onclick="openModal(${index})">
                        <i class="fas fa-pencil-alt"></i>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            selectedRecordIndex = index;
            document.getElementById('reason-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reason-modal').style.display = 'none';
        }

        function confirmEdit(reason) {
            const records = getSyncedRecords();
            const record = records[selectedRecordIndex];
            setFormState('edit_synced_index', selectedRecordIndex);
            setFormState('edit_reason', reason);
            setFormState('answers', {}); 
            setFormState('line', record.line);
            setFormState('q2', record.answers?.q2);
            window.location.href = 'house_questions_edit.html';
        }

        window.onload = loadSyncedRecords;
    </script>
</body>
</html>
