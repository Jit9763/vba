<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - डेटा अपडेट करें</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .update-header-text {
            color: #f2994a;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }
        .record-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .record-line {
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .record-label {
            font-weight: 500;
            color: #666;
        }
        .edit-icon-btn {
            margin-top: 10px;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            border-top: 1px solid #eee;
            padding-top: 10px;
            display: inline-block;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: #f5f5f5;">
        <div class="header" style="background-color: #f2994a; height: 70px;">
            <div class="header-left">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;">←</a>
                <span style="font-size: 18px; font-weight: 500; margin-left: 15px;">एचएलओ ऐप</span>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;"><i class="fas fa-home"></i></a>
            </div>
        </div>

        <div class="update-header-text">डेटा अपडेट करें</div>

        <div id="records-list" style="padding: 0 15px; flex: 1; overflow-y: auto;">
            <!-- Pending records will appear here -->
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function loadPendingRecords() {
            const allRecords = getAllRecords();
            const list = document.getElementById('records-list');
            
            if (allRecords.length === 0) {
                list.innerHTML = `<div class="empty-state">कोई रिकॉर्ड उपलब्ध नहीं है।</div>`;
                return;
            }

            list.innerHTML = allRecords.map(rec => {
                const buildingNo = rec.q1 || (rec.answers ? rec.answers.q1 : 'N/A');
                const houseNo = rec.q2 || (rec.answers ? rec.answers.q2 : 'N/A');
                const name = rec.answers ? rec.answers.q11 : 'N/A';
                const isPending = rec.status === 'Pending';
                
                return `
                <div class="record-card" style="${isPending ? 'border-left: 5px solid #f2994a;' : ''}">
                    <div class="record-line"><span class="record-label">लाइन क्रमांक:</span> ${rec.line || 'N/A'}</div>
                    <div class="record-line"><span class="record-label">भवन नम्बर:</span> ${buildingNo}</div>
                    <div class="record-line"><span class="record-label">जनगणना मकान नंबर:</span> ${houseNo}</div>
                    <div class="record-line"><span class="record-label">परिवार के मुखिया का नाम:</span> ${name}</div>
                    <div class="record-line"><span class="record-label">स्थिति:</span> ${isPending ? '<span style="color:orange; font-weight:bold;">पेंडिंग (नया डेटा)</span>' : '<span style="color:green">सिंक किया गया</span>'}</div>
                    
                    <div class="edit-icon-btn" onclick="editAnyRecord('${rec.id}')">
                        <i class="fas fa-pencil-alt"></i> संपादित करें
                    </div>
                </div>
            `}).join('');
        }

        function editAnyRecord(id) {
            const record = getAllRecords().find(r => r.id === id);
            if (record) {
                setFormState('answers', record.answers);
                setFormState('q1', record.q1 || record.answers?.q1);
                setFormState('q2', record.q2 || record.answers?.q2);
                setFormState('line', record.line);
                window.location.href = 'house_questions_edit.html';
            }
        }

        function editAnyRecord(id) {
            // Find the record across all sources
            let all = [...getSyncedRecords()];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('pending_records')) {
                    const data = JSON.parse(localStorage.getItem(key) || '[]');
                    if (Array.isArray(data)) all = all.concat(data);
                }
            }
            const record = all.find(r => r.id === id);
            if (record) {
                setFormState('answers', record.answers);
                setFormState('q1', record.q1 || record.answers?.q1);
                setFormState('q2', record.q2 || record.answers?.q2);
                setFormState('line', record.line);
                window.location.href = 'house_questions_edit.html';
            }
        }

        function editRecordFromSearch(key, index) {
            const data = JSON.parse(localStorage.getItem(key));
            const record = data[index];
            setFormState('edit_pending_index', index);
            setFormState('edit_pending_key', key); // Store the specific key to update
            setFormState('answers', record.answers);
            setFormState('line', record.line);
            setFormState('q2', record.answers?.q2);
            window.location.href = 'house_questions_edit.html';
        }

        function editRecord(index) {
            const records = getPendingRecords();
            const record = records[index];
            setFormState('edit_pending_index', index);
            setFormState('answers', record.answers);
            setFormState('line', record.line);
            setFormState('q2', record.answers?.q2);
            window.location.href = 'house_questions_edit.html';
        }

        window.onload = loadPendingRecords;
    </script>
</body>
</html>
