<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - सिंक करें</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sync-header { font-size: 14px; font-weight: bold; color: #333; text-align: center; margin: 20px 0; }
        .declaration-box {
            display: flex;
            padding: 0 20px;
            gap: 15px;
            margin-bottom: 20px;
        }
        .declaration-text { font-size: 12px; color: #333; line-height: 1.5; text-align: justify; }
        #sig-canvas {
            border: 1px solid #999;
            background: #fff;
            width: 90%;
            height: 250px;
            margin: 0 auto;
            display: block;
            border-radius: 4px;
            touch-action: none;
        }
        .sync-footer-btns {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-orange-sync {
            background: #f2994a;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
        .btn-orange-sync:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: #f5f5f5;">
        <div class="header" style="background-color: #f2994a; height: 70px;">
            <div class="header-left">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;">←</a>
                <span style="font-size: 18px; font-weight: 500; margin-left: 15px;">एचएलओ ऐप</span>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;"><i class="fas fa-home"></i></a>
            </div>
        </div>

        <div class="sync-header">कृपया नीचे हस्ताक्षर करें:</div>

        <div class="declaration-box">
            <input type="checkbox" id="confirm-check" style="width: 20px; height: 20px; flex-shrink: 0; margin-top: 3px;">
            <div class="declaration-text">
                मैं पुष्टि करता/करती हूँ कि मैंने अपने द्वारा भरी गई प्रविष्टियों में सभी जानकारी सही-सही दर्ज की है। मैंने इन भरी गई प्रविष्टियों की जानकारी की सत्यता की जाँच कर ली है और अब इसे अपलोड कर रहा/रही हूँ।
            </div>
        </div>

        <canvas id="sig-canvas"></canvas>

        <div class="sync-footer-btns">
            <button class="btn-orange-sync" onclick="clearSig()">क्लियर करें</button>
            <button class="btn-orange-sync" id="sync-btn" onclick="startSync()" disabled>सेव करें और सिंक करें</button>
        </div>

        <div id="sync-status-container" style="padding: 0 20px; margin-top: 10px; text-align: center;">
            <div id="sync-status" style="font-size: 13px; color: #666; margin-bottom: 5px;"></div>
            <div style="width: 100%; background: #eee; height: 4px; border-radius: 2px; overflow: hidden;">
                <div id="sync-progress" style="width: 0%; background: #2ecc71; height: 100%; transition: width 0.3s;"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        // Resize canvas to fit screen
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startDrawing(e) {
            drawing = true;
            draw(e);
        }
        function endDrawing() {
            drawing = false;
            ctx.beginPath();
        }
        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - rect.top;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDrawing);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', endDrawing);

        function clearSig() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        document.getElementById('confirm-check').addEventListener('change', function() {
            document.getElementById('sync-btn').disabled = !this.checked;
        });

        async function startSync() {
            const statusText = document.getElementById('sync-status');
            const progress = document.getElementById('sync-progress');
            const user = getCurrentUser();
            const btn = document.getElementById('sync-btn');
            
            const pendingRecords = getPendingRecords(user.id);
            const sampleRecords = getSyncedRecords(); 
            
            const allToSync = [...pendingRecords, ...sampleRecords];

            if (allToSync.length === 0) {
                alert("सिंक करने के लिए कोई नया डेटा नहीं है।");
                return;
            }

            statusText.innerText = "सिंक शुरू हो रहा है... (" + allToSync.length + " रिकॉर्ड)";
            progress.style.width = '30%';
            btn.disabled = true;
            btn.innerText = "सिंक हो रहा है...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(allToSync)
                });

                progress.style.width = '100%';
                statusText.innerText = "सिंक सफलतापूर्वक पूरा हुआ!";
                
                // CLEAR PENDING RECORDS after sync
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const key = localStorage.key(i);
                    if (key && key.includes('pending_records')) {
                        localStorage.removeItem(key);
                    }
                }
                
                // Also clear temporary synced records for this device
                localStorage.removeItem('census_synced_records_' + user.id);

                alert(allToSync.length + " रिकॉर्ड सफलतापूर्वक गूगल शीट में सिंक कर दिए गए हैं। अब आपका स्थानीय डेटा साफ़ कर दिया गया है।");
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Sync error:", error);
                statusText.innerText = "सिंक फेल हो गया। कृपया इंटरनेट चेक करें।";
                alert("सिंक करने में समस्या आई।");
                btn.disabled = false;
                btn.innerText = "सेव करें और सिंक करें";
            }
        }
    </script>
</body>
</html>
