<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - सारांश देखें</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .summary-header { color: #f2994a; font-size: 14px; font-weight: bold; text-align: center; margin: 15px 0; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 15px;
            margin-bottom: 20px;
        }
        .stat-item {
            text-align: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .stat-num { font-size: 16px; font-weight: bold; color: #000; display: block; }
        .stat-label { font-size: 10px; color: #666; }
        .row-center { grid-column: span 2; display: flex; justify-content: space-around; border-bottom: 1px solid #eee; padding: 10px 0; }
        .row-bottom { grid-column: span 2; display: flex; justify-content: space-around; padding: 10px 0; }
        
        .record-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 0 15px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .record-line { font-size: 13px; color: #333; margin-bottom: 5px; }
        .record-label { font-weight: 500; color: #666; }
        .view-icon-btn {
            margin-top: 10px;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            border-top: 1px solid #eee;
            padding-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: #f5f5f5;">
        <div class="header" style="background-color: #f2994a; height: 70px;">
            <div class="header-left">
                <span class="icon-btn" onclick="toggleDrawer()" style="font-size: 24px; margin-left: 15px;">☰</span>
                <span style="font-size: 18px; font-weight: 500; margin-left: 15px;">एचएलओ ऐप</span>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="icon-btn" style="font-size: 24px;"><i class="fas fa-home"></i></a>
            </div>
        </div>

        <div class="summary-header">सारांश देखें</div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-num" id="stat-total-houses">0000</span>
                <span class="stat-label">कुल जनगणना मकान</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="stat-non-res">0</span>
                <span class="stat-label">कुल गैर-आवासीय मकानों</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="stat-normal-fam">000</span>
                <span class="stat-label">कुल सामान्य परिवार</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="stat-inst-fam">0</span>
                <span class="stat-label">कुल संस्थागत परिवारों</span>
            </div>
            
            <div class="row-center">
                <div style="text-align: center;">
                    <span class="stat-num" style="color: #2ecc71;" id="stat-complete">0</span>
                    <span class="stat-label">पूर्ण</span>
                </div>
                <div style="text-align: center;">
                    <span class="stat-num" style="color: #e74c3c;" id="stat-incomplete">0</span>
                    <span class="stat-label">अपूर्ण</span>
                </div>
            </div>

            <div class="row-bottom">
                <div style="text-align: center;">
                    <span class="stat-num" style="color: #3498db;" id="stat-synced">0</span>
                    <span class="stat-label">सिंक किए गये</span>
                </div>
                <div style="text-align: center;">
                    <span class="stat-num" id="stat-locked">0</span>
                    <span class="stat-label">लॉक किए गये</span>
                </div>
                <div style="text-align: center;">
                    <span class="stat-num" style="color: #e74c3c;" id="stat-deleted">0</span>
                    <span class="stat-label">हटाये गये</span>
                </div>
            </div>
        </div>

        <div id="records-list" style="flex: 1; overflow-y: auto; padding-bottom: 30px;">
            <!-- Records will appear here -->
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function loadSummaryRecords() {
            renderDrawer(); // Add hamburger menu
            const pending = getPendingRecords();
            const synced = getSyncedRecords();
            const all = [...synced, ...pending];
            
            // Calculate Stats
            const totalHouses = new Set(all.map(r => r.answers?.q2 || r.q2 || r.house_no)).size;
            
            const nonRes = all.filter(r => {
                let q7 = String(r.answers?.q7 || r.q7 || "").trim();
                if (!q7) return false;
                // Standard Census: 1 (Residential) and 2 (Residential-cum-other) are residential
                const isResidential = q7.startsWith("1") || q7.startsWith("2") || q7.includes("आवास");
                return !isResidential;
            }).length;
            
            const institutional = all.filter(r => r.answers?.is_institutional || r.is_institutional || String(r.answers?.q7 || "").includes("संस्थागत")).length;
            
            // Normal families = Total records - Non-residential - Institutional
            const normalFamilies = all.filter(r => {
                let q7 = String(r.answers?.q7 || r.q7 || "").trim();
                const isRes = q7.startsWith("1") || q7.startsWith("2") || q7.includes("आवास");
                const isInst = r.answers?.is_institutional || r.is_institutional || q7.includes("संस्थागत");
                return isRes && !isInst;
            }).length;

            // Update DOM Stats
            document.getElementById('stat-total-houses').innerText = totalHouses.toString().padStart(4, '0');
            document.getElementById('stat-non-res').innerText = nonRes;
            document.getElementById('stat-normal-fam').innerText = normalFamilies.toString().padStart(3, '0');
            document.getElementById('stat-inst-fam').innerText = institutional;
            document.getElementById('stat-complete').innerText = all.length;
            document.getElementById('stat-synced').innerText = synced.length;
            document.getElementById('stat-locked').innerText = pending.length;

            const list = document.getElementById('records-list');
            if (all.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:50px; color:#888;">कोई रिकॉर्ड उपलब्ध नहीं है।</div>`;
                return;
            }

            list.innerHTML = all.map((rec, index) => {
                const buildingNo = rec.q1 || rec.answers?.q1 || 'N/A';
                const houseNo = rec.answers?.q2 || rec.house_no || 'N/A';
                const familyNo = rec.answers?.q9 || rec.q3 || houseNo;
                const headName = rec.answers?.q11 || 'N/A';
                
                return `
                <div class="record-card">
                    <div class="record-line"><span class="record-label">लाइन क्रमांक:</span> ${rec.line || (index+1).toString().padStart(3, '0')}</div>
                    <div class="record-line"><span class="record-label">जनगणना मकान नंबर:</span> ${houseNo}</div>
                    <div class="record-line"><span class="record-label">भवन नम्बर:</span> ${buildingNo}</div>
                    <div class="record-line"><span class="record-label">परिवार क्रमांक:</span> ${familyNo}</div>
                    <div class="record-line"><span class="record-label">परिवार के मुखिया का नाम:</span> ${headName}</div>
                    <div class="record-line"><span class="record-label">स्थिति:</span> ${rec.status === 'synced' ? '<span style="color:#2ecc71;">लॉक किया गया और सिंक किया गया</span>' : 'लॉक किया गया'}</div>
                    
                    <div class="view-icon-btn" onclick="viewDetails(${index})">
                        <i class="fas fa-eye"></i> विवरण देखें
                    </div>
                </div>
            `}).join('');
        }

        function viewDetails(index) {
            const pending = getPendingRecords();
            const synced = getSyncedRecords();
            const all = [...synced, ...pending];
            const rec = all[index];

            setFormState('answers', rec.answers);
            setFormState('line', rec.line);
            setFormState('q2', rec.answers?.q2);
            setFormState('view_only', true);
            window.location.href = 'house_review.html';
        }

        window.onload = loadSummaryRecords;
    </script>
</body>
</html>
