<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLO Portal - Change Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <a href="dashboard.html" class="icon-btn">←</a>
                <span>पासवर्ड बदलें</span>
            </div>
        </div>
        <div class="login-card">
            <div class="input-group">
                <label>पुराना पासवर्ड</label>
                <input type="password" class="app-input" placeholder="Old Password">
            </div>
            <div class="input-group">
                <label>नया पासवर्ड</label>
                <input type="password" class="app-input" placeholder="New Password">
            </div>
            <div class="input-group">
                <label>पासवर्ड की पुष्टि करें</label>
                <input type="password" class="app-input" placeholder="Confirm Password">
            </div>
            <button class="nav-btn nav-btn-primary" style="width:100%;" onclick="alert('पासवर्ड सफलतापूर्वक बदला गया!'); window.location.href='dashboard.html';">पासवर्ड अपडेट करें</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
