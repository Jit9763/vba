            document.getElementById('current-section-pill').innerText = q.section;
            document.getElementById('q-text').innerText = q.text;
            let html = "";
            if (q.desc) html += `<div class="q-desc">${q.desc}</div>`;

            if (q.type === "radio" || q.type === "radio_with_extras") {
                q.options.forEach(opt => {
                    const isSelected = answers['q' + currentIdx] === opt;
                    html += `<div class="opt-card-new" onclick="selectOpt('${opt}')"><div class="radio-circle ${isSelected ? 'selected' : ''}"></div><span class="opt-text">${opt}</span></div>`;
                });
                if (q.link) html += `<div class="yellow-link"><i class="fas fa-play-circle"></i> ${q.link}</div>`;
                if (q.type === "radio_with_extras") {
                    html += `<input type="text" placeholder="वास्तविक उपयोग दर्ज करें" class="app-input" style="border: 1px solid #ccc; background: #f9f9f9; padding: 12px; margin: 15px 0; border-radius: 4px;">`;
                    html += `<label style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;"><input type="checkbox" style="width: 18px; height: 18px;"> लॉक है?</label>`;
                    html += `<label style="display: flex; align-items: center; gap: 10px;"><input type="checkbox" style="width: 18px; height: 18px;"> संस्थागत है?</label>`;
                }
            } else if (q.type === "radio_grouped") {
                q.groups.forEach(g => {
                    if (g.label) html += `<div class="group-label">${g.label}</div>`;
                    g.options.forEach(opt => {
                        const isSelected = answers['q' + currentIdx] === opt;
                        html += `<div class="opt-card-new" onclick="selectOpt('${opt}')"><div class="radio-circle ${isSelected ? 'selected' : ''}"></div><span class="opt-text">${opt}</span></div>`;
                    });
                });
            } else {
                const val = answers['q' + currentIdx] || "";
                html += `<div class="input-wrapper"><div class="input-label-top">${q.label}</div><input type="${q.type}" id="q-val" class="app-input" value="${val}" placeholder="${q.placeholder || ''}" style="border: 1.5px solid #ccc; padding: 15px; border-radius: 4px;"></div>`;
            }
            document.getElementById('q-body').innerHTML = html;
            
            document.getElementById('line-val').innerText = getFormState('line') || '037';
            document.getElementById('house-val').innerText = getFormState('q2') || '0036';
        }

        function selectOpt(val) { answers['q' + currentIdx] = val; renderQ(); }
        function saveAnswer() {
            const q = questions[currentIdx]; if (!q) return;
            if (q.type.startsWith("radio")) return;
            const input = document.getElementById('q-val'); if (input) answers['q' + currentIdx] = input.value;
        }
        function nextQ() { saveAnswer(); if (currentIdx < 34) { currentIdx++; renderQ(); } else { setFormState('answers', answers); window.location.href = 'house_review.html'; } }
        function prevQ() { saveAnswer(); if (currentIdx > 4) { currentIdx--; renderQ(); } else { window.location.href = 'house_listing.html'; } }
        window.onload = renderQ;
    </script>
</body>
</html>
